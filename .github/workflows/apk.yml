# Build the apk that GitHub hands to users — this repo has no other channel.
#
# WHAT THIS APK IS NOT, YET: it carries no Node binary and no dsh runtime
# snapshot. Those are still pushed onto a device with adb (PLAN.md 线 A, the
# "运行时打进 apk" box is open). So an artifact from here installs and starts,
# then waits on a host that is not there. Nothing here should read as if the
# apk were self-contained.
name: apk

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 插件单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Neither package has dependencies, so there is nothing to install:
      # `node --test` against the shipped files is the entire suite.
      - run: npm test --prefix packages/mobile-layout
      - run: npm test --prefix packages/storage-no-hardlink

  build:
    name: 打包 apk
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Only the release step on a tag uses this.
      contents: write
    # Read once here so the steps below can branch on "is there a key at all"
    # — `secrets` is not a context a step's `if:` can see, `env` is.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # The wrapper jar is committed, so its hash is worth checking on
          # every run rather than trusted once.
          validate-wrappers: true

      - name: 装上 compileSdk 35
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      # A pull request from a fork cannot see secrets — by design. Those runs
      # build unsigned, which is the honest outcome, not a failure.
      - name: 还原签名密钥
        if: ${{ github.event_name != 'pull_request' && env.KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      # The key must not outlive the build, even on an ephemeral runner.
      - name: 抹掉签名材料
        if: always()
        run: rm -f release.jks keystore.properties

      - name: 报告产物与签名状态
        run: |
          ls -l app/build/outputs/apk/*/*.apk
          for apk in app/build/outputs/apk/release/*.apk; do
            case "$apk" in
              *-unsigned.apk) echo "::warning::$apk 未签名——仓库没有配置 KEYSTORE_BASE64" ;;
              *) echo "$apk 已签名" ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          非官方项目,不上架,自行安装需要打开"未知来源"。

          **这个 apk 还不能单独用**:里面没有 Node 二进制,也没有 dsh 运行时快照,
          启动后会一直等一个不存在的 host。运行时目前仍要用 adb 铺进应用数据目录,
          见 PLAN.md 线 A 里"运行时打进 apk"那一条。

          `targetSdk 28` 是保住真实 POSIX 路径和"从数据目录 exec 二进制"的前提,
          不是没跟上,理由见 docs/packaging.md。
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            app/build/outputs/apk/release/*.apk
