# The plugin unit tests, and nothing else.
#
# The apk is NOT built here: it is built on a maintainer's machine and uploaded
# to a Release by hand (scripts/release.sh, docs/packaging.md). That keeps the
# signing key off GitHub entirely — with GitHub-direct distribution the key is
# the only thing tying one release to the next, and a key that never leaves the
# machine cannot leak from a repository secret.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 插件单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # No package has dependencies, so there is nothing to install:
      # `node --test` against the shipped files is the entire suite.
      #
      # packages/llm-routes is absent on purpose — it ships a
      # cordis.patch.yml and no code, so it has no test script to run. What it
      # declares is checked where it takes effect: the route showing up in the
      # model picker on a device.
      - run: npm test --prefix packages/mobile-layout
      - run: npm test --prefix packages/storage-no-hardlink
      - run: npm test --prefix packages/web-search-tencent
      - run: npm test --prefix packages/tool-doc
      # The app's only Java tests: the self-update version comparison.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew :app:testDebugUnitTest
