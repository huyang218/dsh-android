org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=false

# The dsh host the WebView loads. 10.0.2.2 is the emulator's alias for the
# development machine's loopback, so this default points at `dsh --profile
# mobile --port 3099` running on the Mac.
#
# THIS IS A DEVELOPMENT HARNESS, NOT THE PRODUCT SHAPE. The whole point of the
# project is that the host runs ON the phone (PLAN.md 线 A); talking to another
# machine is explicitly out of scope. It exists so the client plugin (线 B) can
# be worked on against a real Android WebView before Node runs on-device.
dsh.devUrl=http://10.0.2.2:3099
