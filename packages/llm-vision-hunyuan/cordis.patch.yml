# 图像输入这条路唯一的落点:给 llm-pi-ai 一条声明了 image 模态的路由。
#
# WHY THIS IS CONFIGURATION AND NOT AN ADAPTER. dsh-llm-deepseek hard-codes
# `inputModalities: ["text"]` (lib/index.js:447 and :519), so no DeepSeek route
# will ever take an image no matter what the client attaches — the composer
# accepts the file and the send is refused with "The current model does not
# support images; switch to a model that does". dsh-llm-pi-ai instead reads the
# modality off the profile (`inputModalities: [...model.input]`), and dsh-base
# ALREADY MOUNTS IT: "mounted dormant: zero routes ... until a `llm-pi-ai:`
# settings section supplies provider profiles". This file is that supply,
# shipped with the apk instead of typed into settings.yaml on a phone.
#
# A PATCH REPLACES THE KEY, IT DOES NOT MERGE INTO IT.
# cordis-plugin-include applies overrides as `target[key] = value`, so the
# `config:` below REPLACES whatever config the llm-pi-ai row carried. That is
# safe today only because dsh-base mounts that row with no config at all. If a
# future dsh gives it one, this file has to carry that too, and the symptom of
# forgetting would be the other setting silently reverting to its default.
#
# PRECEDENCE. The web Models page writes the same `llm-pi-ai:` section into
# $DSH_HOME/settings.yaml, and a settings section overrides the composition
# entry wholesale. Editing providers there therefore drops this route rather
# than merging with it — upstream's order, stated here so it is not diagnosed
# as the plugin breaking.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      # A hand-declared route: pi-ai ships no `hunyuan` catalog entry, so
      # endpoint, protocol and every model fact are stated here.
      hunyuan:
        displayName: 腾讯混元
        # A HUNYUAN API KEY, NOT the TENCENTCLOUD_SECRET_ID/KEY pair
        # packages/web-search-tencent signs with. Two Tencent products, two
        # credential systems: 联网搜索 is a cloud API signed per request with
        # TC3-HMAC-SHA256, while this endpoint is OpenAI-compatible and
        # authenticates with `Authorization: Bearer <key>`. Reusing the
        # SecretId here fails as an opaque 401.
        #
        # Resolved per request through the credentials seam, with the launch
        # environment as the fallback — which is the door the app owns
        # (HostEnv/KeysActivity fills it in on the device).
        apiKeyEnv: HUNYUAN_API_KEY
        api: openai-completions
        baseURL: https://api.hunyuan.cloud.tencent.com/v1
        models:
          # 模型 ID、输入/输出长度 come from Tencent's published model list
          # (cloud.tencent.com/document/product/1729/104753, read 2026-08-22);
          # they are NOT verified against a live key in this repo — the first
          # person with a key finds out, and a wrong id fails as UNKNOWN_MODEL
          # at the provider, naming itself.
          #
          # The lengths are the documented figures rounded DOWN to a round
          # number rather than up to a power of two. The doc gives "24k", which
          # is not necessarily 24576, and the two wrong answers do not cost the
          # same: under-claiming trims a prompt that would have fit, while
          # over-claiming is a request the provider rejects mid-turn.
          - id: hunyuan-vision-1.5-instruct
            name: 混元视觉 1.5
            contextWindow: 24000
            maxTokens: 16000
            input: [text, image]
          # The deep-thinking twin. No `reasoningEfforts:` here on purpose: the
          # levels are a wire vocabulary this route has not been observed
          # speaking, and declaring one wrong sends an unknown value on every
          # request. It thinks server-side either way.
          - id: hunyuan-t1-vision-20250916
            name: 混元 T1 视觉
            contextWindow: 28000
            maxTokens: 20000
            input: [text, image]
