# 本仓库声明的模型路由。**这个包没有代码**,只有这份 patch。
#
# WHY CONFIGURATION AND NOT AN ADAPTER. dsh-llm-deepseek hard-codes
# `inputModalities: ["text"]` (lib/index.js:447 and :519), so no DeepSeek route
# will ever take an image no matter what the client attaches — the composer
# accepts the file and the send is refused with "The current model does not
# support images". dsh-llm-pi-ai instead reads the modality off the profile
# (`inputModalities: [...model.input]`), and dsh-base ALREADY MOUNTS IT:
# "mounted dormant: zero routes ... until a `llm-pi-ai:` settings section
# supplies provider profiles". This file is that supply, shipped with the apk
# instead of typed into settings.yaml on a phone.
#
# A PATCH REPLACES THE KEY, IT DOES NOT MERGE INTO IT.
# cordis-plugin-include applies overrides as `target[key] = value`, so the
# `config:` below REPLACES whatever config the llm-pi-ai row carried. That is
# safe today only because dsh-base mounts that row with no config at all. If a
# future dsh gives it one, this file has to carry that too, and the symptom of
# forgetting would be the other setting silently reverting to its default.
#
# PRECEDENCE. The web Models page writes the same `llm-pi-ai:` settings section
# into $DSH_HOME/settings.yaml, and a settings section overrides the
# composition entry wholesale. Editing providers there therefore drops these
# routes rather than merging with them — upstream's order, stated here so it is
# not diagnosed as the plugin breaking.
#
# 每条路由的 key 都来自应用的「密钥」页(HostEnv/KeysActivity 写进 host 的启动
# 环境),per-request 解析,不落进 dsh 自己的凭据库。
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      # ── 腾讯云 TokenHub ──────────────────────────────────────────────────
      # 账号和联网搜索是同一个。**但 key 是两回事**——TokenHub 用它自己控制台里
      # 建的 API Key 走 Bearer,不是联网搜索那对 TC3 签名的 SecretId/SecretKey。
      #
      # 两条路由都实测能收图(2026-08-23,API 35 模拟器,真实 key):同一张 64x64
      # 的应用图标,问"几个字母、什么底色",两个模型都答对了 D、H 和黑色底,连 H
      # 横梁上那个蓝点都说了出来。
      #
      # **但这件事有个前提,写在 composition/profiles/handheld/cordis.patch.yml
      # 里**:必须关掉运行时上下文快照。dsh 会在用户那条消息后面再追加一条 `user`
      # 消息,而 TokenHub 的协议文档把顺序写死成
      # `[system(可选) → user → assistant → user → ...]`;两条连续的 user 会被
      # 归一化合并,合并时 image_url 那个 content part 被丢掉。开着它,这两条路由
      # 都表现为"收不到图"——而那正是我一开始的误判。
      tokenhub:
        displayName: 腾讯云 TokenHub
        apiKeyEnv: TOKENHUB_API_KEY
        api: openai-completions
        baseURL: https://tokenhub.tencentmaas.com/v1
        models:
          # 首选:TokenHub 的 DeepSeek 专篇把它列为「多模态理解模型」,而且它在
          # 「语言模型」表里带 Function Calling,装得下 dsh 的 system + tools +
          # 历史。实测 TTFT 1.2s。
          - id: deepseek/deepseek-v4-flash-vision-exp
            name: DS-V4-Flash-Vision(看图)
            contextWindow: 1000000
            maxTokens: 384000
            input: [text, image]

          # 也能收图,但慢得多:同一个问题实测 TTFT 38s、21 tok/s,而上面那个是
          # 1.2s。留着是因为它上下文和输出都更大,长任务时值这个等待。
          - id: kimi-k3
            name: Kimi K3(看图)
            contextWindow: 1000000
            # 文档说 K3 的 max completion tokens 默认 131072,上限更高;这里取
            # 那个默认值,不去够上限。
            maxTokens: 131072
            input: [text, image]

# 模型 ID、上下文与输出长度抄自腾讯云 TokenHub 的模型列表(2026-08-23 读取),
# 两条路由都拿真实 key 连图带文打通过。
#
# ID 错会以 `UNKNOWN_MODEL` 报出来并念出 ID;长度报大了则是一次被服务端拒掉的
# 超长请求,而消息那时已经落库,会话会反复重试同一个必失败的请求——所以宁可往
# 下取,不往上凑。
#
# 最难查的不是这两种,是**声明了 image 而那头其实不看图**:客户端放行、请求
# 200、流式正常,只有模型说它看不见。上面 TokenHub 那段就是这么撞出来的。
