# The `handheld` agent preset: what is left of a coding agent when the device
# cannot give it a shell.
#
# Derived from the shipped `standard` preset by removal, not by invention. Two
# families are gone and both for the same reason — they resolve services the
# handheld host composition does not mount:
#
#   tool-bash / tool-pwsh   waiting for `shell`      (no subprocess → no pty)
#   tool-fs-search          waiting for `subprocess` (its search shells out)
#
# `tool-web` is NOT in that family and belongs here: the search it exposes runs
# server-side through the `web-search-deepseek` row dsh-base already mounts, so
# it needs no shell, no local index and no native module — only a key.
#
# tool-fs STAYS: `ctx.fs` comes from the `fs-sandbox` row, which never touches
# subprocess. Losing bash costs the agent its commands; losing fs would cost it
# its subject matter, and that is the difference between a reduced agent and a
# pointless one.
#
# Losing tool-fs-search is the sharpest real cost here: the agent can read and
# write any file it is pointed at, but cannot go looking. Directory listing
# through tool-fs is the remaining way to explore.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are an agent powered by the {{model}} model, running on the user's
      phone. Your working directory is {{cwd}}. You have no shell: there is no
      command execution and no local file search. You read and write files,
      look at attachments, search the web, and talk. Say so plainly when a
      request needs a command instead of pretending an equivalent.

# Read, write, list. The one tool the handheld form is built around.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# Asking the person is more valuable, not less, on a device where the agent
# cannot go find the answer itself.
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    # Required by the plugin's schema — it has no default, and a preset that
    # omits it fails to mount, which surfaces as session.create returning
    # `agent-preset-invalid`.
    allowParallelInProgress: true

# Web search. The one way this agent can learn something it was not told and
# cannot read off the filesystem — worth more here than on a desktop, where the
# person has a browser one window away.
#
# `fetch: false` is stated HERE, not inherited. dsh-base sets it on its own
# tool-web row, but this preset is a separate mount and an omitted config takes
# the schema default — which is `fetch: true`. Relying on the base row would
# have quietly handed the model an arbitrary-URL fetcher on a phone, which is
# the exact thing dsh disables by default: that provider defers SSRF protection
# and the model would choose the request target.
#
# Search stays on: it is a server-side retrieval the model cannot point
# anywhere. Needs a DeepSeek key, the same one the Models page writes; without
# it the tool mounts and fails per call rather than breaking the session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    search: true
    fetch: false

# 读 Word / Excel / PowerPoint。本仓库的行,不是上游的。
#
# 为什么非要一个工具:`tool-fs` 的 read 是**文本**读取器,指给它一个 .docx 拿到的
# 是 ZIP 的字节——不报错,就是一堆噪声,然后模型拿着噪声推理。手机上人常留的恰好
# 就是这类文件,所以这是"文件系统 + LLM + 会话 + 附件"这句话缺的那一半。
#
# 解析不加任何依赖:docx/xlsx/pptx 本质是 ZIP + XML,Node 自带的 zlib 就够。
# 种子不用动、锁不用重生成、公开 apk 里不多一份 licence。
#
# 名字是包名而不是 @deepseek-ai/*,所以它得能从 profile 目录解析出来——靠
# prepare-runtime.sh 把 packages/tool-doc/ vendor 进
# profiles/handheld/node_modules/dsh-plugin-tool-doc/。这条链断了的表现是建会话
# 直接失败(agent-preset-invalid),不是工具不出现。
#
# PDF 不支持,而且是明确不支持:read_document 见到 %PDF- 会指名报出来,不会把
# 二进制当文本吐给模型。
- id: tool-doc
  name: dsh-plugin-tool-doc
